[project]
name = "employeedesk-api"
version = "0.0.1"
description = "EmployeeDesk - bilingual (en/ar) HR and procurement assistant backend"
authors = [{ name = "Tarik Kaan Koc", email = "tarikkaan1koc@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "fastapi[standard]>=0.139.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.3",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "redis>=5",
    "httpx>=0.27.0",
    "openai>=1.60.0",
    "jinja2>=3.1.6",
    "pyjwt>=2.8.0",
    "argon2-cffi>=25.1.0",
    "openpyxl>=3.1.5",
    "pyrate-limiter>=4.4.0",
    "fakeredis[lua]>=2.26",
]
requires-python = "==3.14.*"
readme = "README.md"

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "fastapi run src/app/main.py --reload --host localhost --port 8012"
mock-erp = "uvicorn src.mock_erp.main:app --reload --host 127.0.0.1 --port 8013"
migrate = "alembic upgrade head"
migrate-down = "alembic downgrade -1"
revision = "alembic revision --autogenerate -m"
seed = "python scripts/seed_data.py"
set-password = "python scripts/create_employee.py"
test = "pytest -q"
test-set = "python scripts/run_test_set.py"
test-report = "python scripts/build_test_report.py"
lint = "ruff check ."

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"
exclude = [".git", ".venv", "__pypackages__", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "S"]
ignore = ["S101", "S110", "S105", "S106", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ASYNC210", "ASYNC240", "ASYNC251", "B023"]
"tests/*" = ["B017", "B023"]
"migrations/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pre-commit>=4.1.0",
]
