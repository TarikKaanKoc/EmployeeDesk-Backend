# One public hostname for the console. The API is not exposed: the browser
# reaches it only through the console's same-origin proxy, and the mock ERP
# is reachable from nothing but the API (networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employeedesk
  namespace: employeedesk
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    # The assistant streams; buffering would hold every token until the end.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: [employeedesk.example]
      secretName: employeedesk-tls
  rules:
    - host: employeedesk.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: employeedesk-web
                port:
                  name: http
