# Secrets come from Azure Key Vault through the Secrets Store CSI driver and
# are mirrored into one Kubernetes Secret (`employeedesk-secrets`) so the
# deployments can `envFrom` it. Nothing secret is written in this repo.
#
# Requires on the cluster: the Secrets Store CSI driver with the Azure
# provider (AKS add-on `azure-keyvault-secrets-provider`) and a workload
# identity with `get` on secrets in the vault. The vault, like everything
# else, is in Qatar Central.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: employeedesk-keyvault
  namespace: employeedesk
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "<workload-identity-client-id>"
    keyvaultName: "kv-employeedesk-qatar"
    tenantId: "<tenant-id>"
    cloudName: AzurePublicCloud
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: redis-url
          objectType: secret
        - |
          objectName: jwt-secret-key
          objectType: secret
        - |
          objectName: azure-openai-api-key
          objectType: secret
  # The driver creates and keeps this Secret in sync while at least one pod
  # mounts the CSI volume; the deployments mount it for exactly that reason.
  secretObjects:
    - secretName: employeedesk-secrets
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
        - objectName: redis-url
          key: REDIS_URL
        - objectName: jwt-secret-key
          key: JWT_SECRET_KEY
        - objectName: azure-openai-api-key
          key: AZURE_OPENAI_API_KEY
