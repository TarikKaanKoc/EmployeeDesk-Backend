# One identity for the API and mock ERP pods, federated to an Azure managed
# identity (workload identity) so the CSI driver can read Key Vault without
# a client secret anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: employeedesk-api
  namespace: employeedesk
  annotations:
    azure.workload.identity/client-id: "<workload-identity-client-id>"
  labels:
    azure.workload.identity/use: "true"
automountServiceAccountToken: false
