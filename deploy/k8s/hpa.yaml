apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: employeedesk-api
  namespace: employeedesk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: employeedesk-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: employeedesk-web
  namespace: employeedesk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: employeedesk-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
