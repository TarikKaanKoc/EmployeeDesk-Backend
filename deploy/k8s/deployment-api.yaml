apiVersion: apps/v1
kind: Deployment
metadata:
  name: employeedesk-api
  namespace: employeedesk
  labels:
    app.kubernetes.io/name: employeedesk-api
    app.kubernetes.io/part-of: employeedesk
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: employeedesk-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: employeedesk-api
        app.kubernetes.io/part-of: employeedesk
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: employeedesk-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Two replicas on two nodes, or the second replica buys nothing.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: employeedesk-api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: employeedesk-api
      containers:
        - name: api
          image: employeedesk-api
          args: ["api"]
          ports:
            - name: http
              containerPort: 8012
          env:
            - name: PORT
              value: "8012"
          envFrom:
            - configMapRef:
                name: employeedesk-config
            - secretRef:
                name: employeedesk-secrets
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Startup: the process plus a first DB round trip. Liveness: the
          # process answers at all (no dependencies, so a Redis blip does not
          # restart every pod). Readiness: Postgres and Redis both answer, so
          # a pod that cannot do its job is taken out of the Service.
          startupProbe:
            httpGet:
              path: /api/health/
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          lifecycle:
            # Let the endpoint controller drop the pod before uvicorn stops
            # accepting; otherwise the last few requests of a rollout 502.
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: employeedesk-keyvault
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
