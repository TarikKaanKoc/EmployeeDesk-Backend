# Development only: the shape of the Secret the deployments expect, for a
# cluster without the Key Vault CSI driver (kind, minikube). Not listed in
# kustomization.yaml; apply by hand and never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: employeedesk-secrets
  namespace: employeedesk
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://employeedesk:change-me@postgres.employeedesk.svc:5432/employeedesk"
  REDIS_URL: "redis://redis.employeedesk.svc:6379/0"
  JWT_SECRET_KEY: "change-me-64-random-bytes"
  AZURE_OPENAI_API_KEY: ""
