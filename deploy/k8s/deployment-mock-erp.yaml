# The mock ERP stands in for the real one and is deployed like a real one:
# its own pods, its own service, reachable only from the API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employeedesk-mock-erp
  namespace: employeedesk
  labels:
    app.kubernetes.io/name: employeedesk-mock-erp
    app.kubernetes.io/part-of: employeedesk
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: employeedesk-mock-erp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: employeedesk-mock-erp
        app.kubernetes.io/part-of: employeedesk
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: employeedesk-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: employeedesk-mock-erp
      containers:
        - name: mock-erp
          image: employeedesk-api
          args: ["mock-erp"]
          ports:
            - name: http
              containerPort: 8013
          env:
            - name: PORT
              value: "8013"
            - name: HEALTH_PATH
              value: /health
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: employeedesk-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: employeedesk-keyvault
