# The console. Stateless; reads the API over the cluster network and holds
# no secret of its own (the session cookie is minted by the API).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employeedesk-web
  namespace: employeedesk
  labels:
    app.kubernetes.io/name: employeedesk-web
    app.kubernetes.io/part-of: employeedesk
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: employeedesk-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: employeedesk-web
        app.kubernetes.io/part-of: employeedesk
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: employeedesk-web
      containers:
        - name: web
          image: employeedesk-web
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: employeedesk-web-config
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
